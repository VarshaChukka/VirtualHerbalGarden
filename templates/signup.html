{% extends 'base.html' %}

{% block title %}Signup - AyurvedaPlants{% endblock %}

{% block content %}
<div class="wrapper">
    <div class="form-header">
        <div class="titles">
            <div class="title-register">Register</div>
        </div>
    </div>
    <form action="{{ url_for('auth.signup') }}" class="register-form" method="POST" autocomplete="off">
        <div class="input-box">
            <input type="text" class="input-field" id="reg-username" name="username"
                value="{{ username if username else '' }}" required>
            <label for="reg-username" class="label">Username</label>
            <i class='bx bx-user icon'></i>
        </div>
        <div class="input-box">
            <input type="email" class="input-field" id="reg-email" name="email" value="{{ email if email else '' }}"
                required>
            <label for="reg-email" class="label">Email</label>
            <i class='bx bx-envelope icon'></i>
        </div>
        <div class="input-box">
            <input type="password" class="input-field" id="reg-pass" name="password" required>
            <label for="reg-pass" class="label">Password</label>
            <i class='bx bx-lock-alt icon'></i>
        </div>
        <div class="input-box">
            <button type="submit" class="btn-submit" id="SignUpBtn">Sign Up <i class='bx bx-user-plus'></i></button>
        </div>
        <div class="switch-form">
            <span>Already have an account? <a href="{{ url_for('auth.login') }}">Login</a></span>
        </div>
    </form>
</div>
{% endblock content %}
