{% extends 'base.html' %}

{% block title %}User Profile - AyurvedaPlants{% endblock %}

{% block content %}
<div style="text-align: center; margin-top: 100px;">
    <h1>Welcome, {{ user.username }}!</h1>
    <p>This is your profile page.</p>
    <p>Email: {{ user.email }}</p>
    <p>Member Since: {{ user.created_at.strftime('%Y-%m-%d') }}</p>
    <p><a href="{{ url_for('main.home') }}">Go to Home</a></p>
    <p><a href="{{ url_for('auth.logout') }}">Logout</a></p>
</div>
{% endblock content %}
