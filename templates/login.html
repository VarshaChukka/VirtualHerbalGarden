{% extends 'base.html' %}

{% block title %}Login - AyurvedaPlants{% endblock %}

{% block content %}
<div class="wrapper">
    <div class="form-header">
        <div class="titles">
            <div class="title-login">Login</div>
        </div>
    </div>
    <form action="{{ url_for('auth.login') }}" class="login-form" method="POST" autocomplete="off">
        <div class="input-box">
            <input type="email" class="input-field" id="log-email" name="email" required>
            <label for="log-email" class="label">Email</label>
            <i class='bx bx-envelope icon'></i>
        </div>
        <div class="input-box">
            <input type="password" class="input-field" id="log-pass" name="password" required>
            <label for="log-pass" class="label">Password</label>
            <i class='bx bx-lock-alt icon'></i>
        </div>
        <div class="form-cols">
            <div class="col-1">
                <input type="checkbox" id="remember_me" name="remember_me">
                <label for="remember_me">Remember Me</label>
            </div>
            <div class="col-2">
                <a href="#">Forgot password?</a>
            </div>
        </div>
        <div class="input-box">
            <button type="submit" class="btn-submit" id="SignInBtn">Sign In <i class='bx bx-log-in'></i></button>
        </div>
        <div class="switch-form">
            <span>Don't have an account? <a href="{{ url_for('auth.signup') }}">Register</a></span>
        </div>
    </form>
</div>
{% endblock content %}
